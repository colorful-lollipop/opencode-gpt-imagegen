name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  check:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    uses: ./.github/workflows/_checks.yml
    with:
      ref: ${{ github.ref }}

  release:
    needs: check
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}
      - name: Verify release tag
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "::error::Release workflow must run on a tag ref"
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          git fetch origin main --tags
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          if [[ "$(git rev-parse HEAD)" != "$tag_commit" ]]; then
            echo "::error::Checked-out commit does not match tag $RELEASE_TAG"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error::Tag $RELEASE_TAG (commit $tag_commit) is not reachable from origin/main"
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match package version $package_version"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile
      # npm validates bin paths before running prepublishOnly.
      - name: Build publish artifacts
        run: bun run build
      - name: Publish to npm
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "$package_name@$package_version is already published; skipping npm publish"
          else
            npm publish --provenance --access public
          fi
      - name: Create GitHub release
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
